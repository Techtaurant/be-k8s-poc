name: Deploy POC Dev

on:
    push:
        branches:
            - poc-dev
    workflow_dispatch:

permissions:
    contents: read
    packages: write

env:
    IMAGE_NAME: ghcr.io/techtaurant/be-k8s-poc
    GITOPS_REPOSITORY: Techtaurant/gitops
    GITOPS_IMAGE_FILE: be-dev/kustomization.yaml

jobs:
    build-push-update-gitops:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Backend
              uses: actions/checkout@v4

            - name: Set Up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: "17"
                  distribution: "temurin"
                  cache: gradle

            - name: Verify Backend
              run: |
                  chmod +x gradlew
                  ./gradlew spotlessCheck test -x jacocoTestReport -x jacocoTestCoverageVerification --stacktrace
              env:
                  SPRING_PROFILES_ACTIVE: test
                  TESTCONTAINERS_RYUK_DISABLED: "true"

            - name: Set Image Tag
              id: vars
              run: |
                  short_sha="${GITHUB_SHA::7}"
                  image_tag="poc-dev-${short_sha}"
                  echo "tag=${image_tag}" >> "${GITHUB_OUTPUT}"
                  echo "image=${IMAGE_NAME}:${image_tag}" >> "${GITHUB_OUTPUT}"

            - name: Log In To GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set Up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build And Push Image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: linux/amd64
                  tags: |
                      ${{ steps.vars.outputs.image }}
                      ${{ env.IMAGE_NAME }}:poc-dev
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}

            - name: Checkout GitOps
              uses: actions/checkout@v4
              with:
                  repository: ${{ env.GITOPS_REPOSITORY }}
                  token: ${{ secrets.GITOPS_TOKEN }}
                  path: gitops
                  ref: main

            - name: Update Dev Image Tag
              working-directory: gitops
              run: |
                  sed -i "s|newTag: .*|newTag: ${{ steps.vars.outputs.tag }}|" "${GITOPS_IMAGE_FILE}"
                  git diff -- "${GITOPS_IMAGE_FILE}"

            - name: Commit GitOps Change
              working-directory: gitops
              run: |
                  if git diff --quiet -- "${GITOPS_IMAGE_FILE}"; then
                    echo "No GitOps image tag change to commit."
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add "${GITOPS_IMAGE_FILE}"
                  git commit -m "deploy be-dev ${{ steps.vars.outputs.tag }}"
                  git push
